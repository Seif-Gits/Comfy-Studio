<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Comfy Studio — a Higgsfield-style front end for ComfyUI</title>
  <desc id="desc">Dark banner with lime accents. Left: Comfy Studio title and tagline. Right: a node graph turning a prompt, reference image, and settings into a ComfyUI workflow and a result.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b1b1f" stroke-width="1"/>
    </pattern>
    <linearGradient id="limeFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FF8F"/>
      <stop offset="1" stop-color="#F2FF59"/>
    </linearGradient>
    <linearGradient id="result" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a2a"/>
      <stop offset="0.45" stop-color="#6d6a35"/>
      <stop offset="1" stop-color="#1b1b1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2FF59" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F2FF59" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
      .mono { font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace; }
      .title { font-size: 104px; font-weight: 800; letter-spacing: -5px; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 3.2px; }
      .tagline { font-size: 23px; font-weight: 400; }
      .chip { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .small { font-size: 12px; font-weight: 600; letter-spacing: 1.8px; }
      .node { font-size: 14px; font-weight: 600; }
      .nodeSmall { font-size: 11px; font-weight: 600; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#0b0b0c"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1040" cy="170" r="300" fill="url(#glow)" filter="url(#blur)"/>
  <rect x="0" y="0" width="8" height="640" fill="url(#limeFade)"/>

  <!-- Left: identity -->
  <g class="sans">
    <text x="80" y="118" class="eyebrow" fill="#F2FF59">OPEN SOURCE · MIT LICENSE</text>
    <text x="78" y="260" class="title" fill="#F2F2F3">COMFY</text>
    <text x="78" y="360" class="title" fill="#F2FF59">STUDIO</text>
    <text x="82" y="410" class="tagline" fill="#b9b9c2">A Higgsfield-style front end for</text>
    <text x="82" y="440" class="tagline" fill="#b9b9c2">your own ComfyUI workflows.</text>

    <g transform="translate(82, 500)">
      <rect x="0" y="0" width="92" height="34" rx="9" fill="#141416" stroke="#2a2a2f"/>
      <text x="46" y="22" text-anchor="middle" class="chip" fill="#8d8d96">IMAGES</text>
      <rect x="104" y="0" width="86" height="34" rx="9" fill="#141416" stroke="#2a2a2f"/>
      <text x="147" y="22" text-anchor="middle" class="chip" fill="#8d8d96">VIDEO</text>
      <rect x="202" y="0" width="86" height="34" rx="9" fill="#141416" stroke="#2a2a2f"/>
      <text x="245" y="22" text-anchor="middle" class="chip" fill="#8d8d96">AUDIO</text>
    </g>

    <text x="82" y="592" class="small" fill="#6f6f78">#OpenSourceHiggsfield · ComfyUI local API</text>
  </g>

  <!-- Right: workflow becomes app -->
  <g class="sans">
    <rect x="700" y="100" width="510" height="440" rx="28" fill="#141416" stroke="#2a2a2f"/>
    <text x="740" y="146" class="eyebrow" fill="#8d8d96">A WORKFLOW BECOMES AN APP</text>

    <!-- Input pills -->
    <g>
      <rect x="740" y="180" width="182" height="58" rx="14" fill="#1d1d20" stroke="#2a2a2f"/>
      <circle cx="762" cy="209" r="5" fill="#F2FF59"/>
      <text x="780" y="205" class="node" fill="#f2f2f3">Prompt</text>
      <text x="780" y="222" class="nodeSmall" fill="#8d8d96">TEXT INPUT</text>
    </g>
    <g>
      <rect x="740" y="256" width="182" height="58" rx="14" fill="#1d1d20" stroke="#2a2a2f"/>
      <circle cx="762" cy="285" r="5" fill="#F2FF59"/>
      <text x="780" y="281" class="node" fill="#f2f2f3">Reference</text>
      <text x="780" y="298" class="nodeSmall" fill="#8d8d96">IMAGE 1/10</text>
    </g>
    <g>
      <rect x="740" y="332" width="182" height="58" rx="14" fill="#1d1d20" stroke="#2a2a2f"/>
      <circle cx="762" cy="361" r="5" fill="#F2FF59"/>
      <text x="780" y="357" class="node" fill="#f2f2f3">Settings</text>
      <text x="780" y="374" class="nodeSmall" fill="#8d8d96">SLIDERS · SWITCHES</text>
    </g>

    <!-- Flow lines -->
    <path d="M 922 209 C 940 209, 936 287, 954 287" fill="none" stroke="#3b3b42" stroke-width="2"/>
    <path d="M 922 285 L 954 285" fill="none" stroke="#3b3b42" stroke-width="2"/>
    <path d="M 922 361 C 940 361, 936 287, 954 287" fill="none" stroke="#3b3b42" stroke-width="2"/>
    <path d="M 1146 287 C 1166 287, 1160 209, 1178 209" fill="none" stroke="#3b3b42" stroke-width="2"/>

    <!-- ComfyUI node -->
    <rect x="954" y="256" width="192" height="62" rx="16" fill="url(#limeFade)"/>
    <text x="1050" y="283" text-anchor="middle" class="node" fill="#111111">ComfyUI</text>
    <text x="1050" y="301" text-anchor="middle" class="nodeSmall" fill="#3a3a12">LOCAL API · YOUR GPU</text>

    <!-- Output card -->
    <rect x="1084" y="180" width="94" height="58" rx="14" fill="#1d1d20" stroke="#2a2a2f"/>
    <text x="1131" y="205" text-anchor="middle" class="node" fill="#f2f2f3">Output</text>
    <text x="1131" y="222" text-anchor="middle" class="nodeSmall" fill="#8d8d96">CARD</text>

    <!-- Result preview -->
    <rect x="955" y="346" width="190" height="120" rx="16" fill="url(#result)" stroke="#3b3b42"/>
    <rect x="955" y="346" width="190" height="120" rx="16" fill="#000000" opacity="0.18"/>
    <circle cx="1020" cy="392" r="18" fill="#F2FF59" opacity="0.9"/>
    <path d="M 1012 384 L 1030 392 L 1012 400 Z" fill="#111111"/>
    <text x="1050" y="445" text-anchor="middle" class="nodeSmall" fill="#e7e7b8">RESULT · IMAGE / VIDEO / AUDIO</text>

    <text x="740" y="510" class="small" fill="#6f6f78">NO NODE GRAPH FOR THE END USER</text>
  </g>
</svg>
